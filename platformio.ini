; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = hvac_controller

[env]
; ESP32-C6 requires Arduino core 3.x, which the official platformio/espressif32
; platform does not ship. The community pioarduino fork provides it.
; Pinned for reproducible builds (55.03.311 = Arduino core 3.3.1).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

; Set COM port for uploading/monitoring if auto-detection fails
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

[env:hvac_controller]
; All application sources except the standalone relay-test sketch.
; NOTE: defining build_src_filter replaces the default +<*>, so the filter
; must explicitly re-include everything it wants built.
build_src_filter =
    +<*>
    -<main-relay-test.cpp>
; Dual 1.5MB OTA slots + 32KB NVS + 832KB LittleFS + coredump, sized for the
; EVB's REAL flash (WROOM-1-N4 = 4MB; the board def wrongly claims 8MB).
; NOTE: changing the partition layout erases NVS and the filesystem on flash.
board_build.partitions = partitions_4mb.csv
board_upload.flash_size = 4MB
lib_deps =
    knolleary/PubSubClient@^2.8

[env:test_relays]
; Standalone hardware relay test: its own setup()/loop(), nothing else.
build_src_filter =
    +<main-relay-test.cpp>
