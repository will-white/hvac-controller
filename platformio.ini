; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = hvac_controller

[env]
; ESP32-C6 requires Arduino core 3.x, which the official platformio/espressif32
; platform does not ship. The community pioarduino fork provides it.
; Pinned for reproducible builds (55.03.311 = Arduino core 3.3.1).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
; On the C6's native USB-Serial-JTAG, DTR/RTS drive RESET and GPIO9/boot. A
; monitor that asserts them can drop the chip into the ROM download bootloader
; mid-run — the app stops, EVB GPIOs reset (contacts open), but the MOD-IO2
; keeps its last commanded mask on its own 12V rail and stays LATCHED CLOSED.
; HWCDC::isCDC_Connected() keys off USB SOF, not DTR, so output still flows
; with both lines deasserted. Do not set these back to 1.
monitor_dtr = 0
monitor_rts = 0
; The EVB carries a WROOM-1-N4 (REAL 4MB); the board def wrongly claims 8MB.
; Applies to every env so the bootloader header never advertises 8MB.
board_upload.flash_size = 4MB

; The esp32-c6-devkitc-1 board def defines NEITHER USB flag, and the core only
; instantiates the USB CDC `Serial` when BOTH are set (HWCDC.cpp: `#if
; ARDUINO_USB_MODE && ARDUINO_USB_CDC_ON_BOOT`). Without these, `Serial` is
; UART0 on GPIO16/17 — invisible over the EVB's USB-C, which is wired to the
; C6's native USB-Serial-JTAG. That silently hides the console REPL.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Set COM port for uploading/monitoring if auto-detection fails
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

[env:hvac_controller]
; All application sources except the standalone bring-up sketches.
; NOTE: defining build_src_filter replaces the default +<*>, so the filter
; must explicitly re-include everything it wants built.
build_src_filter =
    +<*>
    -<main-relay-test.cpp>
    -<main-blank.cpp>
    -<main-zigbee-spike.cpp>
    -<main-wifi-scan-test.cpp>
; Dual 1.5MB OTA slots + 32KB NVS + 832KB LittleFS + coredump, sized for the
; EVB's REAL flash (WROOM-1-N4 = 4MB; the board def wrongly claims 8MB).
; NOTE: changing the partition layout erases NVS and the filesystem on flash.
board_build.partitions = partitions_4mb.csv
lib_deps =
    knolleary/PubSubClient@^2.8

[env:test_relays]
; Standalone hardware relay test: its own setup()/loop(), nothing else.
build_src_filter =
    +<main-relay-test.cpp>

[env:blank]
; All relays off, nothing running. Flash this to stop the relay test cycling.
build_src_filter =
    +<main-blank.cpp>

[env:zigbee_spike]
; Phase 6 feasibility spike: native Zigbee coordinator + WiFi on one C6.
; Single-app partition scheme: ZCZR does NOT fit a 4MB dual-OTA slot (finding).
; NOTE: flashing this replaces the partition table -> NVS + LittleFS erased.
build_src_filter =
    +<main-zigbee-spike.cpp>
build_flags =
    ${env.build_flags}
    -DZIGBEE_MODE_ZCZR
board_build.partitions = partitions_zigbee_spike.csv

[env:wifi_scan_oldcore]
; WiFi-diagnostic: same scan probe on the PREVIOUS pioarduino platform release,
; to isolate whether 55.03.311's wifi blob is what breaks scan/join on the C6.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
build_src_filter =
    +<main-wifi-scan-test.cpp>
board_build.partitions = partitions_zigbee_spike.csv

[env:zigbee_spike_baseline]
; Same sketch without the Zigbee stack - size delta = ZBOSS flash cost.
; lib_ignore: the LDF sees the #ifdef'd Zigbee.h include and would pull the
; library (and its unresolvable zboss symbols) in anyway.
; Verbose core logging: the WiFi driver narrates its side of auth/assoc.
build_src_filter =
    +<main-zigbee-spike.cpp>
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5
lib_ignore = Zigbee
board_build.partitions = partitions_zigbee_spike.csv
